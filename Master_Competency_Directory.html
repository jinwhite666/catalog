const grid = document.getElementById('grid');
const searchInput = document.getElementById('search');
const catFilter = document.getElementById('catFilter');
const countShown = document.getElementById('countShown');
const countTotal = document.getElementById('countTotal');
const emptyEl = document.getElementById('empty');

countTotal.textContent = ENTRIES.length;

const cats = [...new Set(ENTRIES.map(e => e.category))];
cats.forEach(c => {
  const opt = document.createElement('option');
  opt.value = c;
  opt.textContent = c.toUpperCase();
  catFilter.appendChild(opt);
});

function render(list){
  grid.innerHTML = '';
  if(list.length === 0){
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
  }
  const frag = document.createDocumentFragment();
  list.forEach(e => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="id">NODE <b>#${String(e.id).padStart(3,'0')}</b></div>
      <h3>${escapeHtml(e.title)}</h3>
      <p>${escapeHtml(e.description)}</p>
      <span class="cat">${escapeHtml(e.category)}</span>
    `;
    frag.appendChild(card);
  });
  grid.appendChild(frag);
  countShown.textContent = list.length;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function applyFilters(){
  const q = searchInput.value.trim().toLowerCase();
  const cat = catFilter.value;
  const filtered = ENTRIES.filter(e => {
    const matchesQ = !q || e.title.toLowerCase().includes(q) || e.description.toLowerCase().includes(q) || String(e.id).includes(q);
    const matchesCat = !cat || e.category === cat;
    return matchesQ && matchesCat;
  });
  render(filtered);
}

searchInput.addEventListener('input', applyFilters);
catFilter.addEventListener('change', applyFilters);

render(ENTRIES);
</script>
