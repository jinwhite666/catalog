function buildFocusTopology(idx, cleanMode=false){
 const p=FA[idx]||FA[0];

 add('pep', 'WE-SI-PAA ZT Gateway', 250, 175, 'Criterion 5 & 6 PEP');

 const app1Name = p.fa.length>18 ? p.fa.slice(0,17)+'…' : p.fa;
 add('app', app1Name, 455, 55, p.fa);
 add('app', secShort+' Core API', 455, 185, p.sector+' API');
 // 5. AI / Cognitive Copilot or Orchestrator
 add('ai', hasAI?'Cognitive AI Agent':'SI Auto-Architect AI', 455, 315, hasAI?'AI / Cognitive':'Neuro-Symbolic CLI');
 // 6. Cloud & Ecosystem Tier (AWS, Microsoft, SAP, Oracle, Red Hat, or Cloud)
 let cloudLabel='Global Cloud Fabric';

 let dbLabel=secShort+' Data Vault';

 else if(hasOra) dbLabel='Oracle Core DB';
 add('db', dbLabel, 665, 120, p.sector+' Data Tier');

 // Compliant Zero-Trust connections
 [['N1','N4'],['N2','N4'],['N3','N4'],['N4','N5'],['N4','N6'],['N5','N6'],['N6','N9'],['N7','N6'],['N7','N8'],['N6','N8']].forEach(e=>S.edges.push(e));
 // In default SI-drift inspection mode, include a legacy SI shortcut (N2 -> N6) so the user can see violation detection or click Auto-Remediate
 if(!cleanMode) S.edges.push(['N2','N6']);
 S.gen=true;

function dir(a,b){return(L[a.type]<L[b.type]||(L[a.type]==L[b.type]&&a.id<b.id))?[a,b]:[b,a]}
function rules(){const r=[];if(!S.gen)return r;
S.edges.map(e=>dir(N(e[0]),N(e[1]))).sort((x,y)=>(x[0].id+x[1].id).localeCompare(y[0].id+y[1].id)).forEach((p,i)=>r.push({id:'A-'+String(i+1).padStart(3,'0'),s:p[0].id,d:p[1].id,port:T[p[1].type].port,kind:'auto'}));
S.over.forEach(o=>r.push({id:o.id,s:o.s,d:o.d,port:o.port,kind:'override',reason:o.reason}));return r}
function hash(){let h=2166136261;const p=FA[S.faIdx];const s=(p?p.id+':':'')+rules().map(r=>[r.s,r.d,r.port].join('>')).sort().join('|');for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')}
const hasOver=(s,d)=>S.over.some(o=>o.s==s&&o.d==d&&o.reason);
function checks(){const R=rules(),A=R.filter(r=>r.kind=='auto'&&!hasOver(r.s,r.d)),g=S.gen,ty=id=>N(id).type;return[
['Default-deny baseline enforced','#34 Zero Trust (ZTNA)',g],
['Data tier unreachable from low-trust zones','#118 Microsegmentation',g&&!A.some(r=>ty(r.d)=='db'&&LOW.includes(ty(r.s)))],
['Low-trust assets reach only the policy gateway','#34 Zero Trust (ZTNA)',g&&!A.some(r=>LOW.includes(ty(r.s))&&ty(r.d)!='pep')],
['AI agents have no direct data-tier access','#51 Model-to-Action Validation',g&&!A.some(r=>ty(r.s)=='ai'&&ty(r.d)=='db')],
['Every override has a documented reason','#116 Policy Drift Detector',g&&S.over.every(o=>Boolean(o.reason&&o.reason.trim()))],
['No orphaned assets','Criteria 5 & 6',g&&S.nodes.every(n=>S.edges.some(e=>e.includes(n.id))||S.over.some(o=>o.s==n.id||o.d==n.id))]]}
const score=()=>{const c=checks();return Math.round(100*c.filter(x=>x[2]).length/c.length)};
function segs(){const g={};S.nodes.forEach(n=>(g[T[n.type].seg]=g[T[n.type].seg]||[]).push(n));return g}

function remediate(){
 const pep=S.nodes.find(n=>n.type=='pep');
 let fixed=0;
 S.edges=S.edges.filter(e=>{
  const [s,d]=dir(N(e[0]),N(e[1]));
  if(hasOver(s.id,d.id))return true;
  const bad=(LOW.includes(s.type)&&d.type!='pep')||(LOW.includes(s.type)&&d.type=='db')||(s.type=='ai'&&d.type=='db');
  if(bad){fixed++;return false}
  return true;
 });
 if(pep){
  S.nodes.forEach(n=>{
   if(n.id!=pep.id&&!S.edges.some(e=>e.includes(n.id))&&!S.over.some(o=>o.s==n.id||o.d==n.id)){
    S.edges.push([n.id,pep.id]);fixed++;
   }
  });
 }
 S.gen=true;touch();
 out(`auto-remediated ${fixed} zero-trust violation(s) for [${FA[S.faIdx].id}] ${FA[S.faIdx].fa} · compliance ${score()}% · build ${hash()}`,'ok');
 ui();
}

 if(S.gen){const g=segs();for(const k in g){const m=g[k],x1=Math.min(...m.map(n=>n.x))-16,y1=Math.min(...m.map(n=>n.y))-28,x2=Math.max(...m.map(n=>n.x))+W+16,y2=Math.max(...m.map(n=>n.y))+H+16,c=T[m[0].type].c;

 const ln=(s,d,col,w,dash)=>{const x1=s.x+W/2,y1=s.y+H/2,x2=d.x+W/2,y2=d.y+H/2,l=Math.hypot(x2-x1,y2-y1)||1,k=S.gen?Math.max(0,l-46)/l:1;
 return`<line x1="${x1}" y1="${y1}" x2="${x1+(x2-x1)*k}" y2="${y1+(y2-y1)*k}" stroke="${col}" stroke-width="${w}" ${dash?'stroke-dasharray="6 4"':''} ${S.gen?'marker-end="url(#ar)"':''}/>`};
 S.edges.forEach(e=>{const[s,d]=S.gen?dir(N(e[0]),N(e[1])):[N(e[0]),N(e[1])],v=S.gen&&!hasOver(s.id,d.id)&&((LOW.includes(s.type)&&d.type!='pep')||(LOW.includes(s.type)&&d.type=='db')||(s.type=='ai'&&d.type=='db'));h+=ln(s,d,v?'#ff5d5d':'#3b5068',v?2.6:1.6)});
 S.over.forEach(o=>h+=ln(N(o.s),N(o.d),'#c9a84c',2,1));

 }else if(S.tab=='pol'){
  h+=!S.gen?'<p class="mut">Press <b>Generate Segments</b> to build the policy set.</p>':
  `<p class="mono ok">DEFAULT: DENY ALL · ${esc(p.id)} (${esc(p.fa)})</p><p class="mono mut">deterministic build ${hash()}</p><table><tr><th>ID</th><th>SRC</th><th>DST</th><th>PORT</th></tr>${rules().map(r=>`<tr class="${r.kind=='override'?'cy':''}"><td>${r.id}</td><td>${r.s}</td><td>${r.d}</td><td>${r.port}</td></tr>`).join('')}</table>`;
 }else{
  if(!S.gen)h+='<p class="mut">Generate segments to evaluate the compliance baseline.</p>';else{const c=checks(),sc=score();
  h+=`<div class="big ${sc==100?'ok':'bad'}">${sc}%</div><p class="mut mono">Criteria 5 &amp; 6 · ${esc(p.id)} ${esc(p.fa)}</p>`+c.map(x=>`<div class="chk"><b class="${x[2]?'ok':'bad'}">${x[2]?'✓':'✗'}</b><div>${x[0]}<small>${x[1]}</small></div></div>`).join('')+
  `<p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="pro" ${sc<100?'disabled':''}>Promote to production</button>${sc<100?'<button class="btn cyb" id="rem">Auto-Remediate Drift</button>':''}</p>${sc<100?'<p class="mut">Promotion is blocked until every gate passes. Click <b>Auto-Remediate Drift</b> or document an override via <code>we-cli</code>.</p>':''}`}
 }
 $('#ins').innerHTML=h+'</div>';
 if(S.tab=='fa'){
  $('#fSearch').oninput=e=>{S.faQ=e.target.value;const pos=e.target.selectionStart;panel();const inp=$('#fSearch');inp.focus();inp.setSelectionRange(pos,pos)};
  $('#fReach').onchange=e=>{S.faReach=e.target.value;panel()};
  $('#fSec').onchange=e=>{S.faSec=e.target.value;panel()};
  $('#loadClean').onclick=()=>{buildFocusTopology(S.faIdx,true);ui()};
 }
}

function ui(){
 $('#faSel').value=String(S.faIdx);
 renderBar();draw();panel();
 $('#lk').classList.toggle('on',S.link);
 const sc=S.gen?score():null;
 $('#score').innerHTML=S.gen?`Compliance <b class="${sc==100?'ok':'bad'}">${sc}%</b>${S.promoted?' · <b class="ok">PROMOTED '+S.promoted+'</b>':''}`:'Compliance <b>—</b>';
}
function out(t,c){const o=$('#out');o.insertAdjacentHTML('beforeend',`<div class="${c||''}">${esc(t)}</div>`);o.scrollTop=o.scrollHeight}
function generate(){S.gen=true;touch();const p=FA[S.faIdx];out(`generated ${Object.keys(segs()).length} segments · ${rules().length} allow rules · [${p.id}] ${p.fa} · default DENY · build ${hash()}`,'ok')}
function promote(){if(!S.gen)return out('REFUSED: run generate first','bad');const f=checks().filter(x=>!x[2]);
if(f.length){out(`REFUSED: ${f.length} compliance gate(s) failing`,'bad');f.forEach(x=>out(`  ✗ ${x[0]} [${x[1]}]`,'bad'));S.tab='cmp';return}
S.promoted=hash();out(`PROMOTED build ${S.promoted} for [${FA[S.faIdx].id}] ${FA[S.faIdx].fa} — deterministic and reproducible`,'ok')}

function run(line){
 out('we-cli> '+line,'cy');
 const a=[...line.matchAll(/"([^"]*)"|(\S+)/g)].map(m=>m[1]!==undefined?m[1]:m[2]),c=a[0];if(!c)return;
 if(c=='help')out('focus list [query] | focus load <SI-001..SI-077> [--clean] | focus current | focus stats | focus fix | nodes | generate | segments | policy list | override allow <src> <dst> <port> --reason "<text>" | override revoke <id> | check | hash | export | promote');
 else if(c=='focus'){
  const sub=a[1]||'current';
  if(sub=='current'){const p=FA[S.faIdx];out(`[${p.id}] Focus Area: ${p.fa} | Key Sales Points & Differentiators: ${p.ksp}`,'ok')}
  else if(sub=='list'){
   const q=(a.slice(2).join(' ')||'').toLowerCase();
   const m=FA.filter(x=>!q||(x.id+' '+x.fa+' '+x.ksp).toLowerCase().includes(q));
   m.slice(0,25).forEach(x=>out(`${x.id}  ${x.fa.padEnd(38,' ')} | ${x.ksp}`));
   if(m.length>25)out(`... showing 25 of ${m.length} matching profiles (use "focus list <keyword>" to narrow)`,'mut');
  }else if(sub=='load'){
   const target=(a[2]||'').toUpperCase();
   const clean=a.includes('--clean');
   const idx=FA.findIndex(x=>x.id.toUpperCase()===target||x.fa.toLowerCase().includes(target.toLowerCase()));
   if(idx<0)out('REFUSED: Focus Area profile not found (try SI-001 through SI-077)','bad');
   else buildFocusTopology(idx,clean);
  }else if(sub=='fix'){
   remediate();
  }else if(sub=='stats'){
   const byR={},byS={};FA.forEach(x=>{byR[x.reach]=(byR[x.reach]||0)+1;byS[x.sector]=(byS[x.sector]||0)+1});
   out('77 Focus Area Profiles — By Reach: '+Object.entries(byR).map(([k,v])=>`${k} (${v})`).join(', '));
   out('77 Focus Area Profiles — By Sector Focus: '+Object.entries(byS).map(([k,v])=>`${k} (${v})`).join(', '));
  }else out('unknown focus subcommand — try: focus list | focus load SI-001 --clean | focus current | focus stats | focus fix','bad');
 }
 else if(c=='nodes')S.nodes.forEach(n=>out(`${n.id}  ${n.name}  [${n.type}] ${n.meta?'· '+n.meta:''}`));
 else if(c=='generate')generate();
 else if(!S.gen&&c!='promote')out('run "generate" first','bad');
 else if(c=='segments'){const g=segs();for(const k in g)out(`${k}: ${g[k].map(n=>n.name).join(', ')}`)}
 else if(c=='policy')rules().forEach(r=>out(`${r.id}  allow ${r.s} -> ${r.d}  tcp/${r.port}  ${r.kind}${r.reason?'  # '+r.reason:''}`));
 else if(c=='hash')out(hash());
 else if(c=='check'){checks().forEach(x=>out(`${x[2]?'✓':'✗'} ${x[0]} [${x[1]}]`,x[2]?'ok':'bad'));out(`score ${score()}%`)}
 else if(c=='export'){const p=FA[S.faIdx];out(`# we-cli export · [${p.id}] ${p.fa} · Differentiators: ${p.ksp} · build ${hash()}`);out('we-cli policy default deny');rules().forEach(r=>out(`we-cli policy allow ${r.s} ${r.d} ${r.port}${r.reason?` --reason "${r.reason}"`:''}`))}
 else if(c=='promote')promote();
 else if(c=='override'&&a[1]=='allow'){const s=find(a[2]||''),d=find(a[3]||''),i=a.indexOf('--reason'),why=i>0?(a[i+1]||'').trim():'';
 if(!s||!d)out('REFUSED: unknown source or destination (see "nodes")','bad');
 else if(!/^\d{1,5}$/.test(a[4]||''))out('REFUSED: port must be numeric','bad');
 else if(!why)out('REFUSED: every override requires --reason "<text>"','bad');
 else{S.over.push({id:'O-'+S.o++,s:s.id,d:d.id,port:a[4],reason:why});touch();out(`override ${S.over[S.over.length-1].id} recorded: ${s.id} -> ${d.id} tcp/${a[4]} # ${why}`,'ok')}
 }else if(c=='override'&&a[1]=='revoke'){const n=S.over.length;S.over=S.over.filter(o=>o.id!=a[2]);touch();out(S.over.length<n?'revoked '+a[2]:'no such override','bad')}
 else out('unknown command — type "help"','bad');
 ui();
}

// Populate header selector
$('#faSel').innerHTML=FA.map((x,i)=>`<option value="${i}">[${esc(x.id)}] ${esc(x.fa)} — ${esc(x.ksp)}</option>`).join('');
$('#faSel').onchange=e=>{buildFocusTopology(+e.target.value,false);ui()};

$('#ci').addEventListener('keydown',e=>{if(e.key=='Enter'){run(e.target.value.trim());e.target.value=''}});
$('#pal').innerHTML+=Object.keys(T).map(k=>`<button class="pi" draggable="true" data-t="${k}"><i style="background:${T[k].c}"></i>${T[k].n}</button>`).join('');
$('#pal').addEventListener('click',e=>{const b=e.target.closest('.pi');if(!b)return;const c=S.nodes.length;add(b.dataset.t,null,40+(c%7)*60,30+(c%9)*40);touch();ui()});
$('#pal').addEventListener('dragstart',e=>{const b=e.target.closest('.pi');if(b)e.dataTransfer.setData('text/plain',b.dataset.t)});
$('#cv').addEventListener('dragover',e=>e.preventDefault());
$('#cv').addEventListener('drop',e=>{e.preventDefault();const t=e.dataTransfer.getData('text/plain');if(!T[t])return;const r=$('#cv').getBoundingClientRect();add(t,null,Math.round(e.clientX-r.left-W/2),Math.round(e.clientY-r.top-H/2));touch();ui()});
let drag=null;
$('#cv').addEventListener('pointerdown',e=>{const g=e.target.closest('[data-id]');if(!g){S.sel=null;S.from=null;return ui()}
const id=g.dataset.id;if(S.link){if(!S.from)S.from=id;else{link(S.from,id);S.from=null}return ui()}
S.sel=id;const n=N(id),r=$('#cv').getBoundingClientRect();drag={n,dx:e.clientX-r.left-n.x,dy:e.clientY-r.top-n.y};ui()});
addEventListener('pointermove',e=>{if(!drag)return;const r=$('#cv').getBoundingClientRect();drag.n.x=Math.max(0,Math.round(e.clientX-r.left-drag.dx));drag.n.y=Math.max(0,Math.round(e.clientY-r.top-drag.dy));draw()});
addEventListener('pointerup',()=>{if(drag){drag=null;touch();ui()}});
$('#ins').addEventListener('click',e=>{
 const fc=e.target.closest('[data-fidx]');
 if(fc){buildFocusTopology(+fc.dataset.fidx,false);return ui()}
 const t=e.target;if(t.dataset.tab){S.tab=t.dataset.tab}
 if(t.id=='del'){const id=S.sel;S.nodes=S.nodes.filter(n=>n.id!=id);S.edges=S.edges.filter(x=>!x.includes(id));S.over=S.over.filter(o=>o.s!=id&&o.d!=id);S.sel=null;touch()}
 if(t.id=='pro')promote();
 if(t.id=='rem')remediate();
 ui();
});
$('#ins').addEventListener('change',e=>{const n=N(S.sel);if(!n)return;if(e.target.id=='nm')n.name=e.target.value||n.name;if(e.target.id=='ty')n.type=e.target.value;touch();ui()});
$('#gen').onclick=()=>{generate();ui()};
$('#fixBtn').onclick=()=>remediate();
$('#lk').onclick=()=>{S.link=!S.link;S.from=null;ui()};
$('#chk').onclick=()=>{S.tab='cmp';ui()};
$('#exp').onclick=()=>{
 const p=FA[S.faIdx];
 const d={
  product:'PillarSuite Auto-Architect',
  product_id:'WE-COG-SI0001-SW (WE-SI-PAA)',
  focus_area_profile:p,
  focus_area_catalog_total:FA.length,
  build:S.gen?hash():null,
  default_policy:'deny',
  nodes:S.nodes,
  edges:S.edges,
  segments:S.gen?Object.fromEntries(Object.entries(segs()).map(([k,v])=>[k,v.map(n=>n.id)])):{},
  rules:rules(),
  checks:S.gen?checks().map(x=>({check:x[0],framework:x[1],pass:x[2]})):[]
 };
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download=`pillarsuite-${p.id.toLowerCase()}-topology.json`;a.click();
};
out('PillarSuite™ Auto-Architect (WE-SI-PAA) · 77 Focus Area & Differentiator Profiles Loaded · type "help" or "focus list"');
buildFocusTopology(0,false);
run('check');
</script></body></html>
