et Model", "desc": "Analyzing Customers, Suppliers, Competitors, and Complementors in a value network.", "usage": "Map competitors, complementors, customers, and suppliers together to spot where a partnership could grow the market instead of just fighting for share.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Game Theory & Competitive Strategy", "name": "Blindspot Analysis", "desc": "Identifying unchallenged corporate assumptions that expose organizations to strategic disruption.", "usage": "Explicitly list what your team is assuming a competitor won't do, since the biggest competitive threats usually come from that blind list.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Game Theory & Competitive Strategy", "name": "Minimax Strategy", "desc": "Minimizing the possible maximum loss in zero-sum competitive environments.", "usage": "Choose the product option that minimizes the worst-case outcome when facing an uncertain competitive response, rather than optimizing for the best case.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Game Theory & Competitive Strategy", "name": "Signaling Theory", "desc": "Analyzing how asymmetric information is communicated through observable actions.", "usage": "Analyze what a competitor's public roadmap announcement is actually signaling to the market versus what they intend to ship.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Game Theory & Competitive Strategy", "name": "Mechanism Design", "desc": "Reverse game theory: Designing rules and incentives to achieve an optimal outcome.", "usage": "Design a marketplace's rules (auction, matching, incentive structure) backward from the outcome you want, rather than bolting incentives onto an existing flow.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Game Theory & Competitive Strategy", "name": "War Gaming", "desc": "Simulating adversary maneuvers and business competitive reactions under varying conditions.", "usage": "Run a structured simulation of competitor responses to a planned launch before committing, to surface reactions the roadmap hasn't accounted for.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Game Theory & Competitive Strategy", "name": "Strategic Group Mapping", "desc": "Clustering competitors on key strategic dimensions to visualize market positioning.", "usage": "Plot competitors on two key dimensions (e.g. price vs. feature depth) to find an underserved position for a new product line.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Macro Environment & Geopolitics", "name": "PESTLE Analysis", "desc": "Macro-environmental factor analysis: Political, Economic, Social, Tech, Legal, Environmental.", "usage": "Scan Political, Economic, Social, Technological, Legal, Environmental factors before entering a new market to catch macro risks a feature-level analysis would miss.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Macro Environment & Geopolitics", "name": "CAGE Distance Framework", "desc": "Cross-border distance factors: Cultural, Administrative, Geographic, Economic.", "usage": "Assess Cultural, Administrative, Geographic, Economic distance before assuming a product that works in one market will translate to another.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Macro Environment & Geopolitics", "name": "Porter's Diamond", "desc": "Determinants of national competitive advantage in particular industries.", "usage": "Assess a country's factor conditions, demand, related industries, and rivalry to judge whether it's a credible base for a new product hub.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Macro Environment & Geopolitics", "name": "VUCA / BANI Framework", "desc": "Environmental descriptors: Volatile, Uncertain, Complex, Ambiguous / Brittle, Anxious, Nonlinear, Incomprehensible.", "usage": "Frame a market's Volatility/Uncertainty (or Brittleness/Anxiety) explicitly when setting how much scenario buffer a product roadmap needs.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Macro Environment & Geopolitics", "name": "Power Transition Theory", "desc": "International relations theory on war risk during shifts in regional/global hegemony.", "usage": "Assess whether a rising competitor's growth trajectory puts it on a collision course with the incumbent leader in a product category.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Macro Environment & Geopolitics", "name": "Kondratiev Waves", "desc": "Long 40-60 year economic super-cycles driven by technological revolutions.", "usage": "Situate a product bet within long technology-cycle waves to judge whether it's riding an early, mature, or declining wave.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Macro Environment & Geopolitics", "name": "O-Ring Theory", "desc": "Production model where overall value is bottlenecked by the weakest component in the chain.", "usage": "Check whether one weak link (a single unreliable component or partner) caps the entire product's quality, regardless of how strong the other parts are.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Macro Environment & Geopolitics", "name": "Heartland / Rimland Theory", "desc": "Geopolitical theories of global geographic pivot areas controlling world dominance.", "usage": "Adapt this geopolitical framework to map which infrastructure or data 'chokepoints' give outsized strategic control over a product ecosystem.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Macro Environment & Geopolitics", "name": "Regulatory Capture Indexing", "desc": "Assessing the degree to which regulatory bodies prioritize industry interest over the public.", "usage": "Score how much an incumbent influences the regulatory environment in a target market before assuming a level playing field for market entry.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Macro Environment & Geopolitics", "name": "STEEPLE Analysis", "desc": "Socio-cultural, Technological, Economic, Environmental, Political, Legal, and Ethical evaluation.", "usage": "Extend PESTLE with an explicit Ethics lens when scoping a product's macro-environment risk in AI or biotech categories.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Foresight & Futures Studies", "name": "Scenario Planning", "desc": "Constructing distinct plausible futures to test long-term strategic resilience.", "usage": "Build 3-4 plausible futures for a market and stress-test the product roadmap against each, ic Intelligence", "discipline": "Foresight & Futures Studies", "name": "Black Swan Theory", "desc": "Evaluating rare, high-impact events rationalized only in hindsight (Taleb).", "usage": "Explicitly stress-test the product roadmap against low-probability, high-impact shocks instead of only planning for the expected case.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Foresight & Futures Studies", "name": "Existential Risk Taxonomy", "desc": "Categorizing events that could eradicate humanity or permanently curtail potential.", "usage": "Classify catastrophic-but-rare failure modes for a high-stakes product (safety-critical, financial, medical) to make sure the worst cases are covered, not just common ones.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Foresight & Futures Studies", "name": "Delphi Method", "desc": "Structured forecasting process based on iterative rounds of expert consensus.", "usage": "Run structured, anonymous expert rounds to converge on a product-market forecast when data is too sparse for quantitative modeling.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Foresight & Futures Studies", "name": "Cross-Impact Analysis", "desc": "Assessing how the probability of one future event alters the likelihood of others.", "usage": "Map how multiple uncertain trends interact before finalizing a scenario plan, since trends rarely move independently.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Foresight & Futures Studies", "name": "Kardashev Scale", "desc": "Method of measuring a civilization's level of technological advancement based on energy consumption.", "usage": "Use a y) instead of just compromising.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Innovation & Technology Management", "name": "Gartner Hype Cycle", "desc": "Visual maturity lifecycle: Innovation Trigger, Peak of Inflated Expectations, Trough of Disillusionment, Slope of Enlightenment, Plateau of Productivity.", "usage": "Place a candidate technology on the hype curve to time a product bet past the trough of disillusionment rather than at the inflated peak.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Innovation & Technology Management", "name": "S-Curve of Innovation", "desc": "Tracking technology performance improvement versus cumulative engineering effort over time.", "usage": "Judge whether a core technology is nearing its performance ceiling, signaling it's time to invest in the next S-curve rather than optimize the current one.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Innovation & Technology Management", "name": "Bass Diffusion Model", "desc": "Mathematical model predicting how new products are adopted by innovators and imitators.", "usage": "Forecast a new product's adoption curve using innovation/imitation coefficients to set realistic growth targets instead of a straight-line guess.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Innovation & Technology Management", "name": "Stage-Gate Process", "desc": "Governance process dividing development into structured stages separated by approval gates.", "usage": "Run a new product concept through defined go/no-go gates with clear criteria at each stage, so weak ideas get killed before major spend.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Innovation & Technology Management", "name": "Lean Startup", "desc": "Build-Measure-Learn feedback loop emphasizing rapid hypothesis testing and iteration.", "usage": "Run build-measure-learn cycles against a validated-learning metric to decide whether to persevere or pivot before scaling spend on a new product line.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Innovation & Technology Management", "name": "Value Proposition Canvas", "desc": "Aligning product features and pain relievers with customer pains, gains, and jobs-to-be-done.", "usage": "Map customer jobs, pains, and gains against your product's pain relievers and gain creators to check for genuine product-market fit before building.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Business Strategy & Management", "name": "McKinsey 7S Framework", "desc": "Organizational alignment: Strategy, Structure, Systems, Shared Values, Style, Staff, Skills.", "usage": "Check whether Strategy, Structure, Systems, Shared Values, Skills, Style, and Staff are aligned before diagnosing why a product initiative is stalling in execution.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Business Strategy & Management", "name": "Core Competence Model", "desc": "Identifying unique collective learning and coordinating capabilities that provide competitive advantage.", "usage": "Identify what your organization does better than anyone else and check whether the product roadmap is actually leveraging it or drifting away from it.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strateg le social relationships (~150).", "usage": "Use this social-group-size limit as a design constraint when scoping the practical ceiling for a product's collaborative or team-based features.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Behavioral Science & Economics", "name": "Principal-Agent Problem", "desc": "Conflict in priorities between asset owner (principal) and delegator (agent).", "usage": "Check whether an internal team's incentives (e.g. sales comp) are actually aligned with the product outcomes leadership wants, before blaming execution.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 3: Strategic Intelligence", "discipline": "Behavioral Science & Economics", "name": "Survivorship Bias Analysis", "desc": "Logical error of focusing on successful entities while ignoring failures that did not survive.", "usage": "Check whether a 'best practice' pattern in successful products is real or an artifact of only studying the survivors, before copying it.", "partLabel": "Strategic Intelligence", "partShort": "Part 3", "accent": "#C1922C"}, {"part": "Part 4: Deep-Tech AI Engineering", "discipline": "AI Alignment & Cognitive Architecture", "name": "ReAct Agentic Framework", "desc": "Synergizing reasoning and acting in language models to solve complex reasoning tasks.", "usage": "Evaluate whether an AI product's agent actually interleaves reasoning with tool calls, or just chains prompts, before trusting it with multi-step tasks.", "partLabel": "Deep-Tech AI Engineering", "partShort": "Part 4", "accent": "#1F9C74"}, {"part": "Part 4: Deep-Tech AI Engineering", "discipline": "AI Alignment & Cognitive Architecture", "name": "Constitutional AI / RLAIF", "desc": "Training AI models using self-critique guided by a foundational rule set (constitution).", "usage": "Check whether a model vendor's safety approach relies on a docu const PART_COLORS = {"Business & Buzzwords": "#3B5FCF", "Deep Tech Evaluation": "#8B4FD1", "Strategic Intelligence": "#C1922C", "Deep-Tech AI Engineering": "#1F9C74"};
const PART_ORDER = ["Business & Buzzwords", "Deep Tech Evaluation", "Strategic Intelligence", "Deep-Tech AI Engineering"];

let activePart = "";
let activeDiscipline = "";
let query = "";

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buildPartPills() {
  const wrap = document.getElementById('partPills');
  const counts = {};
  PART_ORDER.forEach(p => counts[p] = DATA.filter(d => d.partLabel === p).length);

  const allPill = document.createElement('div');
  allPill.className = 'pill active';
  allPill.dataset.part = '';
  allPill.innerHTML = `<span>All parts</span><span class="n">(${DATA.length})</span>`;
  wrap.appendChild(allPill);

  PART_ORDER.forEach(p => {
    const el = document.createElement('div');
    el.className = 'pill';
    el.dataset.part = p;
    el.innerHTML = `<span class="dot" style="background:${PART_COLORS[p]}"></span><span>${p}</span><span class="n">(${counts[p]})</span>`;
    wrap.appendChild(el);
  });

  wrap.querySelectorAll('.pill').forEach(el => {
    el.addEventListener('click', () => {
      activePart = el.dataset.part;
      wrap.querySelectorAll('.pill').forEach(p2 => {
        p2.classList.toggle('active', p2 === el);
        p2.style.background = p2 === el && activePart ? PART_COLORS[activePart] : (p2 === el ? '#1A1D26' : '#fff');
      });
      populateDisciplineFilter();
      activeDiscipline = "";
      render();
    });
  });
}

function populateDisciplineFilter() {
  const sel = document.getElementById('disciplineFilter');
  sel.innerHTML = '<option value="">All disciplines</option>';
  const pool = activePart ? DATA.filter(d => d.partLabel === activePart) : DATA;
  const disciplines = [...new Set(pool.map(d => d.discipline))];
  disciplines.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = d;
    sel.appendChild(opt);
  });
}

function matches(item) {
  if (activePart && item.partLabel !== activePart) return false;
  if (activeDiscipline && item.discipline !== activeDiscipline) return false;
  if (query) {
    const q = query.toLowerCase();
    const hay = (item.name + ' ' + item.discipline + ' ' + item.desc + ' ' + item.usage).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function render() {
  const grid = document.getElementById('grid');
  const results = DATA.filter(matches);
  document.getElementById('visibleCount').textContent = results.length;
  document.getElementById('resultMeta').textContent =
    activePart || activeDiscipline || query
      ? `Showing ${results.length} framework${results.length === 1 ? '' : 's'}${activeDiscipline ? ' · ' + activeDiscipline : ''}`
      : `All 344 frameworks`;

  document.getElementById('emptyState').style.display = results.length ? 'none' : 'block';

  grid.innerHTML = results.map(item => `
    <div class="card">
      <div class="tagrow">
        <span class="dot" style="background:${item.accent}"></span>
        <span class="tag">${escapeHtml(item.partShort)} · ${escapeHtml(item.discipline)}</span>
      </div>
      <h3>${escapeHtml(item.name)}</h3>
      <p class="desc">${escapeHtml(item.desc)}</p>
      <div class="usage">
        <p class="ulabel">Product analysis application</p>
        <p>${escapeHtml(item.usage)}</p>
      </div>
    </div>
  `).join('');
}

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value.trim();
  render();
});
document.getElementById('disciplineFilter').addEventListener('change', e => {
  activeDiscipline = e.target.value;
  render();
});

buildPartPills();
populateDisciplineFilter();
render();
</script>
